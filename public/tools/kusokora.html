<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クソコラジェネレータ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --panel: #ffffff;
    --ink: #222;
    --muted: #6b6b6b;
    --line: #dcdcd8;
    --accent: #2337ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 12px 16px 32px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  header h1 { font-size: 18px; margin: 0; }
  header a { color: var(--muted); font-size: 13px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .stage {
    position: relative;
    background: #e8e8e4;
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage.drag { outline: 3px dashed var(--accent); outline-offset: -8px; }
  canvas#view {
    display: none;
    max-width: 100%;
    max-height: 78vh;
    touch-action: none;
    cursor: default;
    background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;
  }
  canvas#view.on { display: block; }
  canvas#view.picking { cursor: crosshair; }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 8px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .panel h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 6px; }
  .row label { display: flex; align-items: center; gap: 4px; font-size: 13px; }
  button, .filebtn {
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fafaf8;
    color: var(--ink);
    cursor: pointer;
  }
  button:hover, .filebtn:hover { border-color: #b8b8b2; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  button.active { border-color: var(--accent); color: var(--accent); }
  .filebtn input { display: none; }
  textarea {
    width: 100%;
    min-height: 72px;
    font: inherit;
    font-size: 15px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    resize: vertical;
  }
  select, input[type="number"] { font: inherit; font-size: 13px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 4px; }
  input[type="number"] { width: 64px; }
  input[type="color"] { width: 32px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
  input[type="range"] { width: 120px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  .props[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>クソコラジェネレータ</h1>
    <a href="/tools/">Tool 一覧へ</a>
    <p>画像はこのブラウザの中だけで処理し、どこにも送りません。</p>
  </header>

  <div class="layout">
    <div class="stage" id="stage">
      <div class="empty" id="empty">
        <strong>画像をここにドロップ</strong>
        右の「画像を開く」か、貼り付け(⌘V / Ctrl+V)でも読み込めます
      </div>
      <canvas id="view"></canvas>
    </div>

    <div class="panel">
      <section>
        <h2>画像</h2>
        <div class="row">
          <label class="filebtn">画像を開く<input type="file" id="file" accept="image/*"></label>
          <button class="primary" id="save" disabled>PNG で保存</button>
        </div>
      </section>

      <section>
        <h2>追加</h2>
        <div class="row">
          <button id="addBalloon" disabled>吹き出し</button>
          <button id="addText" disabled>文字だけ</button>
          <button id="addRect" disabled>塗りつぶし</button>
        </div>
        <p class="hint">塗りつぶしで元のセリフを消してから、吹き出しを重ねます。</p>
      </section>

      <section class="props" id="textProps" hidden>
        <h2>セリフ</h2>
        <textarea id="pText"></textarea>
        <div class="row">
          <label>大きさ <input type="number" id="pSize" min="6" max="2000"></label>
          <label><input type="checkbox" id="pVertical"> 縦書き</label>
        </div>
        <div class="row">
          <label>書体
            <select id="pFont">
              <option value="gothic">ゴシック</option>
              <option value="mincho">明朝</option>
              <option value="dela">極太</option>
              <option value="hand">手書き風</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>文字 <input type="color" id="pColor"></label>
          <label>フチ <input type="color" id="pStroke"></label>
          <label>太さ <input type="range" id="pStrokeW" min="0" max="0.4" step="0.02"></label>
        </div>
        <div class="row">
          <label>吹き出し
            <select id="pBalloon">
              <option value="none">なし</option>
              <option value="ellipse">楕円</option>
              <option value="rect">角丸</option>
              <option value="spike">叫び</option>
            </select>
          </label>
          <label><input type="checkbox" id="pTail"> しっぽ</label>
        </div>
        <p class="hint">右下の四角で大きさ、しっぽ先の丸で向きを変えます。</p>
      </section>

      <section class="props" id="rectProps" hidden>
        <h2>塗りつぶし</h2>
        <div class="row">
          <label>色 <input type="color" id="rColor"></label>
          <button id="pick">スポイト</button>
          <label>角丸 <input type="range" id="rRadius" min="0" max="0.5" step="0.05"></label>
        </div>
        <p class="hint">スポイトを押してから画像をクリックすると、その色で塗ります。</p>
      </section>

      <section class="props" id="commonProps" hidden>
        <h2>選択中</h2>
        <div class="row">
          <button id="front">前面へ</button>
          <button id="back">背面へ</button>
          <button id="dup">複製</button>
          <button id="del">削除</button>
        </div>
      </section>

      <section>
        <div class="row">
          <button id="undo" disabled>元に戻す</button>
        </div>
        <p class="hint">ドラッグで移動、Delete で削除、⌘Z / Ctrl+Z で元に戻す。</p>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const FONTS = {
    gothic: '"Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif',
    mincho: '"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif',
    dela: '"Dela Gothic One", "Hiragino Sans", sans-serif',
    hand: '"Yusei Magic", "Hiragino Maru Gothic ProN", sans-serif',
  };
  const WEIGHT = { gothic: '700', mincho: '700', dela: '400', hand: '400' };
  // 縦書きで 90 度回す文字と、右上へ寄せる句読点
  const ROTATE = new Set('ー―‐-−~〜…‥（）()「」『』【】［］[]〈〉《》<>＜＞{}｛｝=＝');
  const SHIFT = new Set('、。，．,.');
  const SMALL = new Set('ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ');

  const $ = (id) => document.getElementById(id);
  const view = $('view');
  const ctx = view.getContext('2d');
  const stage = $('stage');

  let img = null;              // 元画像(Image)
  let pixels = null;           // スポイト用に元画像を描いた canvas の context
  let objects = [];            // 下から順に描く
  let selected = null;
  let picking = false;
  let history = [];
  let nextId = 1;

  // ---------- 図形の寸法 ----------

  function fontOf(o) {
    return `${WEIGHT[o.font]} ${o.size}px ${FONTS[o.font]}`;
  }

  function lines(o) {
    return (o.text || ' ').split('\n');
  }

  // 文字列だけの外接矩形(中心からの幅・高さ)
  function textBox(o) {
    ctx.save();
    ctx.font = fontOf(o);
    const ls = lines(o);
    let w, h;
    if (o.vertical) {
      const col = o.size * 1.25;
      const maxChars = Math.max(...ls.map((l) => [...l].length), 1);
      w = col * ls.length;
      h = o.size * 1.05 * maxChars;
    } else {
      w = Math.max(...ls.map((l) => ctx.measureText(l).width), o.size * 0.5);
      h = o.size * 1.25 * ls.length;
    }
    ctx.restore();
    return { w, h };
  }

  // 吹き出しを含めた外接矩形
  function bounds(o) {
    if (o.type === 'rect') return { x: o.x, y: o.y, w: o.w, h: o.h };
    const t = textBox(o);
    let w = t.w, h = t.h;
    const pad = o.size * 0.6;
    if (o.balloon === 'ellipse') { w = t.w * Math.SQRT2 + pad; h = t.h * Math.SQRT2 + pad; }
    else if (o.balloon === 'rect') { w = t.w + pad * 1.6; h = t.h + pad * 1.6; }
    else if (o.balloon === 'spike') { w = t.w * Math.SQRT2 + pad * 2.4; h = t.h * Math.SQRT2 + pad * 2.4; }
    else { const s = o.size * o.strokeW; w += s * 2; h += s * 2; }
    return { x: o.x - w / 2, y: o.y - h / 2, w, h };
  }

  function handleSize() {
    const r = view.getBoundingClientRect();
    return 14 * (view.width / (r.width || view.width));
  }

  // ---------- 描画 ----------

  function balloonPath(c, o, b) {
    const cx = o.x, cy = o.y, rx = b.w / 2, ry = b.h / 2;
    c.beginPath();
    if (o.balloon === 'ellipse') {
      c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    } else if (o.balloon === 'rect') {
      c.roundRect(b.x, b.y, b.w, b.h, Math.min(b.w, b.h) * 0.25);
    } else if (o.balloon === 'spike') {
      const n = 22;
      for (let i = 0; i <= n * 2; i++) {
        const a = (i / (n * 2)) * Math.PI * 2;
        const k = i % 2 === 0 ? 1 : 0.78 + 0.06 * Math.sin(i * 7.3);
        const px = cx + Math.cos(a) * rx * k, py = cy + Math.sin(a) * ry * k;
        i === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
      }
      c.closePath();
    }
  }

  function tailPath(c, o, b) {
    const tx = o.x + o.tail.dx, ty = o.y + o.tail.dy;
    const ang = Math.atan2(o.tail.dy, o.tail.dx);
    const base = Math.min(b.w, b.h) * 0.14;
    // しっぽの根元は吹き出しの内側(中心と縁の間)に置き、縁の線を塗りで隠す
    const rx = b.w / 2 * 0.7, ry = b.h / 2 * 0.7;
    const bx = o.x + Math.cos(ang) * rx, by = o.y + Math.sin(ang) * ry;
    const nx = -Math.sin(ang) * base, ny = Math.cos(ang) * base;
    c.beginPath();
    c.moveTo(bx + nx, by + ny);
    c.lineTo(tx, ty);
    c.lineTo(bx - nx, by - ny);
    c.closePath();
  }

  function drawBalloon(c, o) {
    const b = bounds(o);
    const lw = Math.max(2, o.size * 0.09);
    const hasTail = o.tailOn && o.balloon !== 'none';
    c.save();
    c.lineJoin = 'round';
    c.strokeStyle = '#111';
    c.lineWidth = lw * 2;
    balloonPath(c, o, b); c.stroke();
    if (hasTail) { tailPath(c, o, b); c.stroke(); }
    c.fillStyle = '#fff';
    balloonPath(c, o, b); c.fill();
    if (hasTail) { tailPath(c, o, b); c.fill(); }
    c.restore();
  }

  // Web フォントは文字範囲ごとに配られるので、セリフの文字を指定して読み込み、届いたら描き直す
  const loaded = new Set();
  function ensureFont(o) {
    if (!document.fonts || (o.font !== 'dela' && o.font !== 'hand')) return;
    const key = o.font + o.text;
    if (loaded.has(key)) return;
    loaded.add(key);
    document.fonts.load(`${WEIGHT[o.font]} 32px ${FONTS[o.font]}`, o.text).then(render, () => {});
  }

  function drawText(c, o) {
    ensureFont(o);
    if (o.balloon !== 'none') drawBalloon(c, o);
    c.save();
    c.font = fontOf(o);
    c.fillStyle = o.color;
    c.strokeStyle = o.stroke;
    c.lineJoin = 'round';
    const sw = o.size * o.strokeW;
    c.lineWidth = sw * 2;
    const t = textBox(o);
    const ls = lines(o);
    const put = (ch, x, y) => {
      if (sw > 0) c.strokeText(ch, x, y);
      c.fillText(ch, x, y);
    };
    if (o.vertical) {
      const col = o.size * 1.25, step = o.size * 1.05;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      ls.forEach((line, i) => {
        // 1 行目を右端の列に置き、左へ進む
        const x = o.x + t.w / 2 - col * (i + 0.5);
        [...line].forEach((ch, j) => {
          const y = o.y - t.h / 2 + step * (j + 0.5);
          if (ROTATE.has(ch)) {
            c.save(); c.translate(x, y); c.rotate(Math.PI / 2); put(ch, 0, 0); c.restore();
          } else if (SHIFT.has(ch)) {
            put(ch, x + o.size * 0.6, y - o.size * 0.55);
          } else if (SMALL.has(ch)) {
            put(ch, x + o.size * 0.1, y - o.size * 0.1);
          } else {
            put(ch, x, y);
          }
        });
      });
    } else {
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      const lh = o.size * 1.25;
      ls.forEach((line, i) => put(line, o.x, o.y - t.h / 2 + lh * (i + 0.5)));
    }
    c.restore();
  }

  function drawRect(c, o) {
    c.save();
    c.fillStyle = o.color;
    c.beginPath();
    c.roundRect(o.x, o.y, o.w, o.h, Math.min(Math.abs(o.w), Math.abs(o.h)) * o.radius);
    c.fill();
    c.restore();
  }

  function paint(c, withUi) {
    c.clearRect(0, 0, c.canvas.width, c.canvas.height);
    if (img) c.drawImage(img, 0, 0);
    for (const o of objects) (o.type === 'rect' ? drawRect : drawText)(c, o);
    if (withUi && selected) drawSelection(c, selected);
  }

  function drawSelection(c, o) {
    const b = norm(bounds(o));
    const hs = handleSize();
    c.save();
    c.lineWidth = hs / 6;
    c.setLineDash([hs / 2, hs / 3]);
    c.strokeStyle = '#2337ff';
    c.strokeRect(b.x, b.y, b.w, b.h);
    c.setLineDash([]);
    c.fillStyle = '#fff';
    c.fillRect(b.x + b.w - hs / 2, b.y + b.h - hs / 2, hs, hs);
    c.strokeRect(b.x + b.w - hs / 2, b.y + b.h - hs / 2, hs, hs);
    if (o.type === 'text' && o.tailOn && o.balloon !== 'none') {
      c.beginPath();
      c.arc(o.x + o.tail.dx, o.y + o.tail.dy, hs / 2, 0, Math.PI * 2);
      c.fillStyle = '#2337ff';
      c.fill();
    }
    c.restore();
  }

  let queued = false;
  function render() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; paint(ctx, true); });
  }

  function norm(b) {
    return {
      x: Math.min(b.x, b.x + b.w), y: Math.min(b.y, b.y + b.h),
      w: Math.abs(b.w), h: Math.abs(b.h),
    };
  }

  // ---------- 履歴 ----------

  function snapshot() {
    history.push(JSON.stringify({ objects, sel: selected && selected.id }));
    if (history.length > 100) history.shift();
    $('undo').disabled = history.length === 0;
  }

  function undo() {
    const s = history.pop();
    if (!s) return;
    const d = JSON.parse(s);
    objects = d.objects;
    selected = objects.find((o) => o.id === d.sel) || null;
    $('undo').disabled = history.length === 0;
    syncPanel();
    render();
  }

  // ---------- 画像の読み込み ----------

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      img = im;
      view.width = im.naturalWidth;
      view.height = im.naturalHeight;
      const pc = document.createElement('canvas');
      pc.width = im.naturalWidth;
      pc.height = im.naturalHeight;
      pixels = pc.getContext('2d', { willReadFrequently: true });
      pixels.drawImage(im, 0, 0);
      objects = [];
      selected = null;
      history = [];
      $('undo').disabled = true;
      view.classList.add('on');
      $('empty').style.display = 'none';
      for (const id of ['save', 'addBalloon', 'addText', 'addRect']) $(id).disabled = false;
      syncPanel();
      render();
    };
    im.src = url;
  }

  $('file').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drag'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('drag');
    loadFile(e.dataTransfer.files[0]);
  });
  window.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (item) { e.preventDefault(); loadFile(item.getAsFile()); }
  });

  // ---------- 追加 ----------

  function baseSize() {
    return Math.max(16, Math.round(Math.min(view.width, view.height) / 14));
  }

  function addText(balloon) {
    snapshot();
    const size = baseSize();
    const o = {
      id: nextId++, type: 'text',
      x: view.width / 2, y: view.height / 2,
      text: 'セリフ',
      size, font: 'gothic', vertical: balloon,
      color: '#111111', stroke: '#ffffff', strokeW: balloon ? 0 : 0.16,
      balloon: balloon ? 'ellipse' : 'none',
      tailOn: balloon, tail: { dx: size * 2.2, dy: size * 3 },
    };
    objects.push(o);
    select(o);
    $('pText').focus();
    $('pText').select();
  }

  function addRect() {
    snapshot();
    const w = view.width / 4, h = view.height / 5;
    const o = {
      id: nextId++, type: 'rect',
      x: (view.width - w) / 2, y: (view.height - h) / 2, w, h,
      color: '#ffffff', radius: 0.1,
    };
    objects.push(o);
    select(o);
  }

  $('addBalloon').onclick = () => addText(true);
  $('addText').onclick = () => addText(false);
  $('addRect').onclick = addRect;

  // ---------- 選択とパネル ----------

  function select(o) {
    selected = o;
    setPicking(false);
    syncPanel();
    render();
  }

  function syncPanel() {
    const o = selected;
    $('textProps').hidden = !(o && o.type === 'text');
    $('rectProps').hidden = !(o && o.type === 'rect');
    $('commonProps').hidden = !o;
    if (!o) return;
    if (o.type === 'text') {
      if (document.activeElement !== $('pText')) $('pText').value = o.text;
      $('pSize').value = Math.round(o.size);
      $('pVertical').checked = o.vertical;
      $('pFont').value = o.font;
      $('pColor').value = o.color;
      $('pStroke').value = o.stroke;
      $('pStrokeW').value = o.strokeW;
      $('pBalloon').value = o.balloon;
      $('pTail').checked = o.tailOn;
      $('pTail').disabled = o.balloon === 'none';
    } else {
      $('rColor').value = o.color;
      $('rRadius').value = o.radius;
    }
  }

  // 入力欄の変更を選択中の図形へ反映する。連続入力は最初の 1 回だけ履歴に積む
  let editing = null;
  function bind(id, key, conv, evt = 'input') {
    $(id).addEventListener(evt, (e) => {
      if (!selected) return;
      if (editing !== id + selected.id) { snapshot(); editing = id + selected.id; }
      const el = e.target;
      selected[key] = conv(el.type === 'checkbox' ? el.checked : el.value);
      if (key === 'balloon') syncPanel();
      render();
    });
    $(id).addEventListener('change', () => { editing = null; });
    $(id).addEventListener('blur', () => { editing = null; });
  }
  const num = (v) => Math.max(1, Number(v) || 1);
  bind('pText', 'text', String);
  bind('pSize', 'size', num);
  bind('pVertical', 'vertical', Boolean, 'change');
  bind('pFont', 'font', String, 'change');
  bind('pColor', 'color', String);
  bind('pStroke', 'stroke', String);
  bind('pStrokeW', 'strokeW', Number);
  bind('pBalloon', 'balloon', String, 'change');
  bind('pTail', 'tailOn', Boolean, 'change');
  bind('rColor', 'color', String);
  bind('rRadius', 'radius', Number);

  $('del').onclick = removeSelected;
  $('dup').onclick = () => {
    if (!selected) return;
    snapshot();
    const o = JSON.parse(JSON.stringify(selected));
    o.id = nextId++;
    o.x += baseSize();
    o.y += baseSize();
    objects.push(o);
    select(o);
  };
  $('front').onclick = () => reorder(1);
  $('back').onclick = () => reorder(-1);
  $('undo').onclick = undo;

  function reorder(dir) {
    if (!selected) return;
    const i = objects.indexOf(selected), j = i + dir;
    if (j < 0 || j >= objects.length) return;
    snapshot();
    [objects[i], objects[j]] = [objects[j], objects[i]];
    render();
  }

  function removeSelected() {
    if (!selected) return;
    snapshot();
    objects = objects.filter((o) => o !== selected);
    select(null);
  }

  // ---------- スポイト ----------

  function setPicking(on) {
    picking = on;
    view.classList.toggle('picking', on);
    $('pick').classList.toggle('active', on);
  }
  $('pick').onclick = () => setPicking(!picking);

  function pickColor(p) {
    const x = Math.min(view.width - 1, Math.max(0, Math.round(p.x)));
    const y = Math.min(view.height - 1, Math.max(0, Math.round(p.y)));
    const [r, g, b] = pixels.getImageData(x, y, 1, 1).data;
    return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
  }

  // ---------- ポインタ操作 ----------

  function toImage(e) {
    const r = view.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (view.width / r.width),
      y: (e.clientY - r.top) * (view.height / r.height),
    };
  }

  function hit(p) {
    const hs = handleSize();
    if (selected) {
      const b = norm(bounds(selected));
      if (Math.abs(p.x - (b.x + b.w)) <= hs && Math.abs(p.y - (b.y + b.h)) <= hs) return { o: selected, mode: 'resize' };
      if (selected.type === 'text' && selected.tailOn && selected.balloon !== 'none') {
        const tx = selected.x + selected.tail.dx, ty = selected.y + selected.tail.dy;
        if (Math.hypot(p.x - tx, p.y - ty) <= hs) return { o: selected, mode: 'tail' };
      }
    }
    for (let i = objects.length - 1; i >= 0; i--) {
      const b = norm(bounds(objects[i]));
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return { o: objects[i], mode: 'move' };
    }
    return null;
  }

  let drag = null;

  view.addEventListener('pointerdown', (e) => {
    if (!img) return;
    const p = toImage(e);
    if (picking) {
      if (selected && selected.type === 'rect') {
        snapshot();
        selected.color = pickColor(p);
        syncPanel();
        render();
      }
      setPicking(false);
      return;
    }
    const h = hit(p);
    if (!h) { select(null); return; }
    if (h.o !== selected) select(h.o);
    snapshot();
    view.setPointerCapture(e.pointerId);
    const o = h.o;
    drag = {
      mode: h.mode, start: p, moved: false,
      x: o.x, y: o.y, w: o.w, h: o.h, size: o.size,
      dist: o.type === 'text' ? Math.max(1, Math.hypot(p.x - o.x, p.y - o.y)) : 0,
    };
  });

  view.addEventListener('pointermove', (e) => {
    if (!drag || !selected) {
      if (img && !picking) {
        const h = hit(toImage(e));
        view.style.cursor = !h ? 'default' : h.mode === 'resize' ? 'nwse-resize' : h.mode === 'tail' ? 'crosshair' : 'move';
      }
      return;
    }
    const p = toImage(e);
    const o = selected;
    drag.moved = true;
    if (drag.mode === 'move') {
      o.x = drag.x + (p.x - drag.start.x);
      o.y = drag.y + (p.y - drag.start.y);
    } else if (drag.mode === 'tail') {
      o.tail = { dx: p.x - o.x, dy: p.y - o.y };
    } else if (o.type === 'rect') {
      o.w = drag.w + (p.x - drag.start.x);
      o.h = drag.h + (p.y - drag.start.y);
    } else {
      const k = Math.hypot(p.x - o.x, p.y - o.y) / drag.dist;
      o.size = Math.max(6, drag.size * k);
      syncPanel();
    }
    render();
  });

  function endDrag() {
    if (!drag) return;
    // 動かさずに離したら、積んだ履歴を取り消す
    if (!drag.moved) history.pop();
    $('undo').disabled = history.length === 0;
    if (selected && selected.type === 'rect') {
      const b = norm(selected);
      Object.assign(selected, b);
    }
    drag = null;
  }
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', (e) => {
    const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
    if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !typing) { e.preventDefault(); undo(); return; }
    if (typing) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected) { e.preventDefault(); removeSelected(); }
    if (e.key === 'Escape') { setPicking(false); select(null); }
  });

  window.addEventListener('resize', render);

  // ---------- 保存 ----------

  $('save').onclick = () => {
    const out = document.createElement('canvas');
    out.width = view.width;
    out.height = view.height;
    paint(out.getContext('2d'), false);
    out.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'kusokora.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };

  if (new URLSearchParams(location.search).has('debug')) {
    window.__dbg = { get objects() { return objects; }, get selected() { return selected; }, loadFile, render };
  }
})();
</script>
</body>
</html>
