<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棒人間アクション</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --ink: #222;
    --muted: #6b6b6b;
    --line: #dcdcd8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px; }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 960 / 420;
    background: #fbfaf6;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  .help { margin: 10px 2px 0; color: var(--muted); font-size: 13px; }
  kbd {
    display: inline-block;
    min-width: 1.6em;
    padding: 0 0.35em;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    font: 12px/1.6 ui-monospace, Menlo, monospace;
    text-align: center;
  }
  /* スマホ用のボタン。タッチ端末のときだけ出す */
  .touch {
    position: absolute;
    inset: auto 0 0 0;
    display: none;
    justify-content: space-between;
    padding: 8px;
    pointer-events: none;
  }
  .touch.on { display: flex; }
  .pad { display: flex; gap: 8px; pointer-events: auto; }
  .tbtn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid rgba(0, 0, 0, 0.35);
    background: rgba(255, 255, 255, 0.6);
    color: #333;
    font: 600 14px sans-serif;
    touch-action: none;
  }
  .tbtn.down { background: rgba(0, 0, 0, 0.2); }
  @media (max-width: 600px) {
    .tbtn { width: 40px; height: 40px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="game" width="960" height="420" tabindex="0" aria-label="棒人間の横スクロールアクションゲーム"></canvas>
    <div class="touch" id="touch">
      <div class="pad">
        <button class="tbtn" data-act="left" aria-label="左">◀</button>
        <button class="tbtn" data-act="right" aria-label="右">▶</button>
      </div>
      <div class="pad">
        <button class="tbtn" data-act="jump">跳</button>
        <button class="tbtn" data-act="punch">P</button>
        <button class="tbtn" data-act="kick">K</button>
      </div>
    </div>
  </div>
  <p class="help">
    <kbd>←</kbd><kbd>→</kbd> 移動 ・ <kbd>↑</kbd> か <kbd>Space</kbd> ジャンプ ・
    <kbd>Z</kbd> 攻撃(3 回でコンボ。ステージ 2 は棒、3 は剣) ・ <kbd>X</kbd> キック(空中でも出せる) ・ <kbd>P</kbd> 一時停止
  </p>
</div>
<script>
(() => {
  const W = 960, H = 420, GY = 350;
  const GOAL_X = 5000, LEVEL_END = 5200;
  const PAPER = '#fbfaf6';

  const stage = document.getElementById('stage');
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);

  // ---- 入力 ----
  const keys = new Set();  // 押しっぱなし
  const hits = new Set();  // このフレームで押された
  const MAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
    KeyZ: 'punch', KeyJ: 'punch', KeyX: 'kick', KeyK: 'kick',
    Enter: 'start', KeyR: 'retry', KeyP: 'pause', Escape: 'pause',
  };
  addEventListener('keydown', (e) => {
    const a = MAP[e.code];
    if (!a) return;
    e.preventDefault();
    if (!e.repeat) hits.add(a);
    keys.add(a);
  });
  addEventListener('keyup', (e) => {
    const a = MAP[e.code];
    if (a) keys.delete(a);
  });
  // iframe からフォーカスが外れるとキーを離したことが伝わらないので、止めておく
  addEventListener('blur', () => {
    keys.clear();
    if (game.mode === 'play') game.paused = true;
  });
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.tbtn')) return;
    cv.focus();
    hits.add('start');
  });
  const touch = document.getElementById('touch');
  if (matchMedia('(pointer: coarse)').matches) touch.classList.add('on');
  addEventListener('touchstart', () => touch.classList.add('on'), { once: true, passive: true });
  for (const b of touch.querySelectorAll('.tbtn')) {
    const a = b.dataset.act;
    const up = () => { keys.delete(a); b.classList.remove('down'); };
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      b.setPointerCapture(e.pointerId);
      keys.add(a); hits.add(a); hits.add('start');
      b.classList.add('down');
    });
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
  }
  const take = (a) => hits.delete(a);

  // ---- 定義 ----
  // a〜b が当たり判定の出ている時間(秒)。reach と h は等倍のときの距離と高さ
  const ATK = {
    p1:    { dur: .24, a: .06, b: .13, reach: 50, h: 73, dmg: 8,  kx: 160, ky: 0,    stun: .3,  lunge: 90,  kind: 'punch', arm: 'a', next: 'p2' },
    p2:    { dur: .26, a: .06, b: .14, reach: 52, h: 73, dmg: 8,  kx: 180, ky: 0,    stun: .32, lunge: 90,  kind: 'punch', arm: 'b', next: 'p3' },
    p3:    { dur: .42, a: .12, b: .22, reach: 50, h: 82, dmg: 14, kx: 330, ky: -440, stun: .6,  lunge: 140, kind: 'upper', freeze: .1 },
    kick:  { dur: .4,  a: .13, b: .23, reach: 64, h: 48, dmg: 14, kx: 460, ky: -200, stun: .5,  lunge: 60,  kind: 'kick', freeze: .09 },
    air:   { dur: .45, a: .04, b: .32, reach: 56, h: 38, dmg: 12, kx: 340, ky: -120, stun: .45, lunge: 0,   kind: 'airkick' },
    jab:   { dur: .6,  a: .36, b: .45, reach: 48, h: 73, dmg: 8,  kx: 240, ky: -60,  stun: .3,  lunge: 70,  kind: 'punch', arm: 'a' },
    quick: { dur: .42, a: .22, b: .3,  reach: 46, h: 73, dmg: 6,  kx: 180, ky: 0,    stun: .25, lunge: 120, kind: 'punch', arm: 'a' },
    heavy: { dur: .9,  a: .55, b: .66, reach: 62, h: 70, dmg: 15, kx: 480, ky: -280, stun: .55, lunge: 60,  kind: 'heavy', freeze: .1 },
    dash:  { dur: .9,  a: .4,  b: .7,  reach: 48, h: 70, dmg: 12, kx: 420, ky: -200, stun: .5,  lunge: 0,   kind: 'dash', dashV: 560 },
    // 棒(ステージ 2)。3 発目の振り下ろしは盾を崩す
    s1:    { dur: .32, a: .08, b: .17, reach: 84,  h: 70, dmg: 12, kx: 220, ky: 0,    stun: .32, lunge: 80,  kind: 'swing', next: 's2' },
    s2:    { dur: .32, a: .08, b: .17, reach: 84,  h: 62, dmg: 12, kx: 240, ky: -120, stun: .35, lunge: 80,  kind: 'rise', next: 's3' },
    s3:    { dur: .55, a: .18, b: .28, reach: 92,  h: 50, dmg: 22, kx: 300, ky: -520, stun: .7,  lunge: 100, kind: 'slam', freeze: .12, brk: true },
    // 剣(ステージ 3)。3 発目は前にいる敵をまとめて斬る
    w1:    { dur: .28, a: .06, b: .14, reach: 80,  h: 70, dmg: 16, kx: 200, ky: 0,    stun: .3,  lunge: 90,  kind: 'swing', next: 'w2' },
    w2:    { dur: .28, a: .06, b: .14, reach: 80,  h: 66, dmg: 16, kx: 220, ky: 0,    stun: .32, lunge: 90,  kind: 'rise', next: 'w3' },
    w3:    { dur: .5,  a: .14, b: .26, reach: 125, h: 65, dmg: 30, kx: 520, ky: -300, stun: .6,  lunge: 180, kind: 'swing', freeze: .12, brk: true },
    // 武器を持つ敵
    e_staff: { dur: .75, a: .45, b: .55, reach: 78,  h: 65, dmg: 10, kx: 280, ky: -100, stun: .35, lunge: 60,  kind: 'swing' },
    e_slash: { dur: .55, a: .3,  b: .38, reach: 70,  h: 70, dmg: 10, kx: 240, ky: -60,  stun: .3,  lunge: 120, kind: 'swing' },
    b_staff: { dur: .95, a: .55, b: .68, reach: 95,  h: 60, dmg: 16, kx: 500, ky: -300, stun: .55, lunge: 80,  kind: 'slam', freeze: .1 },
    b_sword: { dur: .8,  a: .45, b: .56, reach: 100, h: 65, dmg: 18, kx: 500, ky: -280, stun: .55, lunge: 140, kind: 'swing', freeze: .1 },
  };
  // キック・アッパー・空中キックは盾を崩せる
  ATK.kick.brk = ATK.p3.brk = ATK.air.brk = true;
  const WEAPONS = {
    fist:  { name: '素手', first: 'p1' },
    staff: { name: '棒',   first: 's1' },
    sword: { name: '剣',   first: 'w1' },
  };
  const ETYPES = {
    grunt:  { hp: 30,  speed: 115, scale: 1,    color: '#b3261e', atk: 'jab',     score: 100,  cd: [.9, 1.7] },
    fast:   { hp: 20,  speed: 190, scale: .9,   color: '#d9730d', atk: 'quick',   score: 150,  cd: [.6, 1.2] },
    big:    { hp: 80,  speed: 75,  scale: 1.25, color: '#5b3fa0', atk: 'heavy',   score: 300,  cd: [1.2, 2], heavy: true },
    staffer:{ hp: 40,  speed: 110, scale: 1,    color: '#2b7a3d', atk: 'e_staff', score: 150,  cd: [1, 1.8], weapon: 'staff' },
    shield: { hp: 45,  speed: 90,  scale: 1,    color: '#1f5f8b', atk: 'jab',     score: 200,  cd: [1, 1.8], shield: true },
    blade:  { hp: 35,  speed: 150, scale: 1,    color: '#8b1f5f', atk: 'e_slash', score: 200,  cd: [.8, 1.4], weapon: 'sword' },
    boss:   { hp: 200, speed: 105, scale: 1.6,  color: '#3b3b3b', atk: 'heavy',   score: 1000, cd: [.8, 1.5], heavy: true, boss: true },
    boss2:  { hp: 260, speed: 105, scale: 1.6,  color: '#2d4a2d', atk: 'b_staff', score: 1500, cd: [.8, 1.5], heavy: true, boss: true, weapon: 'staff' },
    boss3:  { hp: 320, speed: 115, scale: 1.6,  color: '#3a2a4a', atk: 'b_sword', score: 2000, cd: [.7, 1.3], heavy: true, boss: true, weapon: 'sword' },
  };
  // areas: カメラの左端が x に来たら画面を止め、list の敵を左右から出す
  const STAGES = [
    { name: '街', theme: 'city', weapon: 'fist', areas: [
      { x: 800,  list: ['grunt', 'grunt', 'grunt'] },
      { x: 1900, list: ['grunt', 'fast', 'grunt', 'fast'] },
      { x: 3000, list: ['big', 'grunt', 'fast', 'grunt'] },
      { x: 3900, list: ['boss', 'grunt', 'grunt'] },
    ] },
    { name: '森', theme: 'forest', weapon: 'staff', areas: [
      { x: 800,  list: ['grunt', 'staffer', 'grunt', 'fast'] },
      { x: 1900, list: ['staffer', 'fast', 'staffer', 'fast'] },
      { x: 3000, list: ['big', 'staffer', 'fast', 'staffer', 'grunt'] },
      { x: 3900, list: ['boss2', 'staffer', 'grunt'] },
    ] },
    { name: '城', theme: 'castle', weapon: 'sword', areas: [
      { x: 800,  list: ['shield', 'grunt', 'staffer', 'grunt'] },
      { x: 1900, list: ['shield', 'blade', 'shield', 'fast'] },
      { x: 3000, list: ['big', 'shield', 'blade', 'staffer', 'blade'] },
      { x: 3900, list: ['boss3', 'shield', 'blade'] },
    ] },
  ];
  const areas = () => STAGES[game.stage].areas;

  const rand = (a, b) => a + Math.random() * (b - a);
  const hash = (i) => { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); };

  // ---- 状態 ----
  const game = { mode: 'title', paused: false, time: 0, playT: 0, score: 0, kills: 0, camX: 0, lock: null, areaIdx: 0, freeze: 0, shake: 0, goT: 0, combo: 0, comboT: 0, endT: 0, clearT: 0,
    stage: 0, stageScore: 0, stageKills: 0, totalT: 0, banner: 0 };
  let player, enemies, parts, items, spawnQ, uid = 0;

  function fighter(o) {
    return Object.assign({ id: ++uid, x: 0, y: GY, vx: 0, vy: 0, f: 1, state: 'idle', t: 0, ph: 0, inv: 0, stun: 0, atk: null, hitSet: null, lunged: false, air: false, scale: 1 }, o);
  }
  function makePlayer() {
    return fighter({ x: 140, hp: 100, max: 100, color: '#1d1d1d', player: true, airUsed: false, buf: null, bufT: 0, jumpT: 0 });
  }
  function makeEnemy(type, x) {
    const T = ETYPES[type];
    return fighter({ x, hp: T.hp, max: T.hp, T, type, color: T.color, scale: T.scale, f: -1, cd: rand(.4, 1), deadT: 0, alt: 0, weapon: T.weapon, shield: T.shield });
  }
  function newGame() {
    game.score = 0; game.kills = 0; game.totalT = 0;
    loadStage(0);
  }
  // ステージを始める。HP は毎ステージ満タンに戻す
  function loadStage(i) {
    uid = 0;
    game.stage = i; game.stageScore = game.score; game.stageKills = game.kills;
    player = makePlayer();
    player.weapon = STAGES[i].weapon;
    enemies = []; parts = []; items = []; spawnQ = [];
    Object.assign(game, { mode: 'play', paused: false, playT: 0, camX: 0, lock: null, areaIdx: 0, freeze: 0, shake: 0, goT: 0, combo: 0, comboT: 0, endT: 0, banner: 2.5 });
  }
  function retryStage() {
    game.score = game.stageScore; game.kills = game.stageKills;
    loadStage(game.stage);
  }
  function setState(F, s) { F.state = s; F.t = 0; }
  function startAttack(F, name) {
    setState(F, 'attack');
    F.atk = name; F.hitSet = new Set(); F.lunged = false;
  }

  // ---- 物理 ----
  function physics(F, dt) {
    F.vy += 1900 * dt;
    F.x += F.vx * dt;
    F.y += F.vy * dt;
    if (F.y >= GY) {
      if (F.air && F.vy > 300) dust(F.x, 4);
      F.y = GY; F.vy = 0; F.air = false;
    } else F.air = true;
  }
  function fric(F, dt) {
    if (F.air) return;
    const d = 1500 * dt;
    F.vx = Math.abs(F.vx) <= d ? 0 : F.vx - Math.sign(F.vx) * d;
  }

  // ---- 攻撃の当たり判定 ----
  function attackTick(F, A, targets) {
    if (!F.lunged && F.t >= A.a) { F.lunged = true; if (A.lunge) F.vx = F.f * A.lunge; }
    if (F.t < A.a || F.t > A.b) return;
    const s = F.scale;
    const x0 = F.x + F.f * 8 * s, x1 = F.x + F.f * A.reach * s, hy = F.y - A.h * s;
    const lo = Math.min(x0, x1), hi = Math.max(x0, x1);
    for (const T of targets) {
      if (T.state === 'dead' || F.hitSet.has(T.id) || T.inv > 0) continue;
      const ts = T.scale;
      if (T.x + 14 * ts < lo || T.x - 14 * ts > hi) continue;
      const top = T.y - 98 * ts, bot = T.y;
      if (hy + 20 * s < top || hy - 20 * s > bot) continue;
      F.hitSet.add(T.id);
      const px = (Math.max(lo, T.x - 14 * ts) + Math.min(hi, T.x + 14 * ts)) / 2;
      hit(F, T, A, px, Math.max(top, Math.min(bot, hy)));
    }
  }
  function hit(F, T, A, px, py) {
    // 盾持ちは、正面からの崩せない攻撃を防ぐ
    if (T.shield && T.state !== 'hurt' && T.state !== 'attack' && !A.brk && (F.x - T.x) * T.f > 0) {
      F.vx = -F.f * 160; T.vx = F.f * 80;
      game.freeze = Math.max(game.freeze, .04);
      spark(px, py, F.f, '#7d8a96');
      parts.push({ kind: 'text', x: T.x, y: T.y - 110, vx: 0, vy: -50, life: .6, max: .6, text: 'ガード', color: '#1f5f8b' });
      return;
    }
    T.hp -= A.dmg;
    const k = T.T && T.T.boss ? 0.35 : T.T && T.T.heavy ? 0.6 : 1;
    T.vx = F.f * A.kx * k;
    if (A.ky) { T.vy = A.ky * k; T.air = true; }
    game.freeze = Math.max(game.freeze, A.freeze || 0.05);
    game.shake = Math.max(game.shake, A.freeze ? 8 : 4);
    spark(px, py, F.f, T.player ? '#c0392b' : '#222');
    if (F.player) { game.combo++; game.comboT = 1; }
    if (T.hp <= 0) {
      T.hp = 0;
      setState(T, 'dead');
      T.f = -F.f;
      T.vy = -380; T.vx = F.f * 420 * k; T.air = true;
      if (!T.player) {
        game.score += T.T.score; game.kills++;
        if (T.type === 'big' || T.T.boss) items.push({ x: T.x, y: T.y - 60, vy: -300, t: 0 });
      }
      return;
    }
    // ボスは攻撃中にのけぞらない
    if (T.T && T.T.boss && T.state === 'attack') return;
    T.f = -F.f;
    T.stun = A.stun * (T.T && T.T.boss ? 0.5 : 1);
    setState(T, 'hurt');
    if (T.player) T.inv = 0.7;
  }

  // ---- プレイヤー ----
  function updPlayer(P, dt) {
    P.t += dt;
    if (P.inv > 0) P.inv -= dt;
    if (P.bufT > 0 && (P.bufT -= dt) <= 0) P.buf = null;
    if (P.jumpT > 0) P.jumpT -= dt;
    const dir = (keys.has('right') ? 1 : 0) - (keys.has('left') ? 1 : 0);

    if (P.state === 'dead') { fric(P, dt); physics(P, dt); return; }
    if (P.state === 'hurt') {
      if (P.t >= P.stun && !P.air) setState(P, 'idle');
      fric(P, dt); physics(P, dt); return;
    }
    if (P.state === 'attack') {
      const A = ATK[P.atk];
      attackTick(P, A, enemies);
      if (P.air) { if (dir) P.vx += dir * 600 * dt; } else fric(P, dt);
      physics(P, dt);
      if (A.next && P.buf === 'punch' && P.t >= A.b && !P.air) { P.buf = null; startAttack(P, A.next); }
      else if (P.t >= A.dur || (A.kind === 'airkick' && !P.air)) setState(P, P.air ? 'jump' : 'idle');
      if (!P.air) P.airUsed = false;
      return;
    }
    if (P.buf) {
      if (P.air) {
        if (!P.airUsed) { P.airUsed = true; P.buf = null; startAttack(P, 'air'); }
      } else { startAttack(P, P.buf === 'punch' ? WEAPONS[P.weapon].first : 'kick'); P.buf = null; }
    }
    if (P.state !== 'attack') {
      P.vx = dir * 270;
      if (dir) P.f = dir;
      if (P.jumpT > 0 && !P.air) { P.vy = -690; P.air = true; P.jumpT = 0; P.airUsed = false; dust(P.x, 3); }
      if (dir && !P.air) P.ph += dt * 14;
      const s = P.air ? 'jump' : dir ? 'run' : 'idle';
      if (P.state !== s) setState(P, s);
    }
    physics(P, dt);
    if (!P.air) P.airUsed = false;
  }

  // ---- 敵 ----
  function updEnemy(E, dt, near) {
    E.t += dt;
    if (E.state === 'dead') { E.deadT += dt; fric(E, dt); physics(E, dt); return; }
    if (E.state === 'hurt') {
      if (E.t >= E.stun && !E.air) setState(E, 'idle');
      fric(E, dt); physics(E, dt); return;
    }
    if (E.state === 'attack') {
      const A = ATK[E.atk];
      attackTick(E, A, [player]);
      if (A.dashV && E.t >= A.a && E.t < A.b) E.vx = E.f * A.dashV; else fric(E, dt);
      if (E.t >= A.dur) { setState(E, 'idle'); E.cd = rand(...E.T.cd); }
      physics(E, dt); return;
    }
    E.cd -= dt;
    const dx = player.x - E.x, adx = Math.abs(dx);
    E.f = dx >= 0 ? 1 : -1;
    const reach = ATK[E.T.atk].reach * E.scale + 10;
    // 近くの 2 体だけが殴りに来て、残りは間合いの外で待つ
    const want = near ? reach * 0.8 : 170 + (E.id % 3) * 35;
    let mv = 0;
    if (player.state !== 'dead') {
      if (adx > want + 8) mv = E.f;
      else if (!near && adx < want - 30) mv = -E.f;
      if (near && adx <= reach && E.cd <= 0 && Math.abs(player.y - E.y) < 80) {
        let name = E.T.atk;
        if (E.T.boss && (E.alt++ % 2 === 1)) name = 'dash';
        startAttack(E, name);
        physics(E, dt); return;
      }
    }
    E.vx = mv * E.T.speed * (mv === -E.f ? 0.6 : 1);
    if (mv) E.ph += dt * E.T.speed / 20;

  // ---- 演出 ----
  function spark(x, y, f, color) {
    for (let i = 0; i < 9; i++) {
      const a = rand(-1.1, 1.1), v = rand(180, 420);
      parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * v * f, vy: Math.sin(a) * v, life: .25, max: .25, color });
    }
    parts.push({ kind: 'ring', x, y, life: .16, max: .16 });
  }
  function dust(x, n) {
    for (let i = 0; i < n; i++) parts.push({ kind: 'dust', x: x + rand(-10, 10), y: GY - 2, vx: rand(-60, 60), vy: rand(-60, -20), life: .4, max: .4 });
  }
  function updParts(dt) {
    for (const p of parts) {
      p.life -= dt;
      if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; }
    }
    parts = parts.filter((p) => p.life > 0);
  }

  // ---- 進行 ----
  function step(dt) {
    game.time += dt;
    if (game.freeze > 0) { game.freeze -= dt; return; }
    game.playT += dt;
    if (game.shake > 0) game.shake = Math.max(0, game.shake - 40 * dt);
    if (game.comboT > 0 && (game.comboT -= dt) <= 0) game.combo = 0;
    if (game.goT > 0) game.goT -= dt;
    if (game.banner > 0) game.banner -= dt;

    updPlayer(player, dt);

    // カメラは右にしか進まない。エリアに入ったら止める
    const maxCam = game.lock ? game.lock.x : LEVEL_END - W;
    game.camX = Math.max(game.camX, Math.min(player.x - W * 0.38, maxCam));
    const A = areas();
    if (!game.lock && game.areaIdx < A.length && game.camX >= A[game.areaIdx].x) {
      game.lock = A[game.areaIdx];
      game.camX = game.lock.x;
      game.lock.list.forEach((type, i) => spawnQ.push({ type, delay: 0.4 + i * 0.8, side: i % 2 ? -1 : 1 }));
      if (game.lock.list[0].startsWith('boss')) spawnQ[0].side = 1;
    }
    player.x = Math.max(game.camX + 20, Math.min(game.camX + W - 20, player.x));

    for (const q of spawnQ) q.delay -= dt;
    for (const q of spawnQ.filter((q) => q.delay <= 0)) {
      enemies.push(makeEnemy(q.type, q.side > 0 ? game.camX + W + 50 : game.camX - 50));
    }
    spawnQ = spawnQ.filter((q) => q.delay > 0);

    const alive = enemies.filter((e) => e.state !== 'dead');
    const near = new Set(alive.slice().sort((a, b) => Math.abs(a.x - player.x) - Math.abs(b.x - player.x)).slice(0, 2));
    for (const e of alive) if (e.T.boss) near.add(e);
    for (const e of enemies) updEnemy(e, dt, near.has(e));
    // 敵同士が重ならないように押し合う
    for (let i = 0; i < alive.length; i++) for (let j = i + 1; j < alive.length; j++) {
      const a = alive[i], b = alive[j], d = b.x - a.x, min = 22 * (a.scale + b.scale);
      if (Math.abs(d) < min) { const push = (min - Math.abs(d)) / 2 * (d >= 0 ? 1 : -1); a.x -= push * .5; b.x += push * .5; }
    }
    enemies = enemies.filter((e) => e.deadT < 1.6);

    if (game.lock && !spawnQ.length && !enemies.some((e) => e.state !== 'dead')) {
      game.lock = null; game.areaIdx++;
      if (game.areaIdx < A.length) game.goT = 3;
    }

    for (const it of items) {
      it.t += dt; it.vy += 1500 * dt; it.y += it.vy * dt;
      if (it.y > GY - 12) { it.y = GY - 12; it.vy = 0; }
      if (!it.got && Math.abs(it.x - player.x) < 30 && player.y > GY - 60 && player.state !== 'dead') {
        it.got = true; player.hp = Math.min(player.max, player.hp + 35);
        parts.push({ kind: 'text', x: it.x, y: it.y - 20, vx: 0, vy: -60, life: .8, max: .8, text: '+35' });
      }
    }
    items = items.filter((it) => !it.got);

    updParts(dt);

    if (player.state === 'dead' && (game.endT += dt) > 1.4) game.mode = 'over';
    if (game.areaIdx >= A.length && player.x >= GOAL_X) {
      game.clearT = game.playT; game.totalT += game.playT;
      game.mode = game.stage + 1 < STAGES.length ? 'stageclear' : 'clear';
    }
  }

  // ---- ポーズ(関節の角度) ----
  // 角度は真下を 0、前向きを正にとる。肘と膝は一つ手前の骨からの相対角
  function pose(F) {
    const t = F.t, g = game.time;
    const p = { lean: 0, legA: [.15, -.05], legB: [-.15, -.05], armA: [.55, 2], armB: [.35, 2.2], chest: 0, hipY: null, mark: false };
    switch (F.state) {
      case 'idle': {
        const b = Math.sin(g * 3 + F.id) * .05;
        p.legA = [.28, -.35 + b]; p.legB = [-.22, -.3 + b];
        p.armA = [.7 + b, 1.9]; p.armB = [.4 + b, 2.1]; p.lean = .04;
        break;
      }
      case 'run': {
        const s = F.ph, S = Math.PI;
        p.legA = [Math.sin(s) * .8, -.25 - .9 * Math.max(0, -Math.sin(s + .8))];
        p.legB = [Math.sin(s + S) * .8, -.25 - .9 * Math.max(0, -Math.sin(s + S + .8))];
        p.armA = [.3 - Math.sin(s) * .7, 1.4]; p.armB = [.3 + Math.sin(s) * .7, 1.4];
        p.lean = .15;
        break;
      }
      case 'jump':

        break;
      case 'hurt':

        p.armA = [-.3 + Math.sin(t * 30) * .3, 1]; p.armB = [2.6, .4];
        if (F.air) p.hipY = -44;
        break;
      case 'dead': {
        const k = Math.min(1, t / .45);
        p.lean = -k * Math.PI / 2;
        p.legA = [.3, -.1]; p.legB = [.1, 0]; p.armA = [2.8, .2]; p.armB = [2.5, .3];

        break;
      }

  function attackPose(F, p) {
    const A = ATK[F.atk], t = F.t;
    const wind = t < A.a ? t / A.a : 0;
    const e = t < A.a ? 0 : t < A.b ? 1 : Math.max(0, 1 - (t - A.b) / (A.dur - A.b));
    p.legA = [.45, -.3]; p.legB = [-.35, -.15];
    p.mark = !F.player && t < A.a;
    switch (A.kind) {
      case 'punch': {
        const arm = [.6 + e - wind * .4, 2 - e * 2 + wind * .3];
        if (A.arm === 'b') { p.armB = arm; p.armA = [.7, 1.9]; } else { p.armA = arm; p.armB = [.4, 2.1]; }
        p.lean = .12 * e - .08 * wind; p.chest = 4 * e;
        break;
      }
      case 'upper':
        p.armA = [.3 + e * 2.4 - wind * .3, .5 + (1 - e) * 1.2]; p.armB = [.4, 2.1];
        p.legA = [.3, -.1]; p.legB = [-.2, -.05];
        p.lean = -.15 * e + .1 * wind;
        break;
      case 'kick':

        p.armA = [.9, 1.6]; p.armB = [-.6, 1.2];
        p.lean = -.3 * e - .05;
        break;
      case 'airkick':
        p.legA = [.5 + e * .85, -1 + e * 1.1]; p.legB = [-.3, -1.2];

        p.lean = -.25 * e; p.hipY = -44;
        break;
      case 'heavy': {
        const sw = t < A.a ? .6 + wind * 2.3 : 2.9 - 1.5 * e;
        p.armA = [sw, .2]; p.armB = [sw - .2, .3];
        p.lean = t < A.a ? -.2 * wind : .25 * e;
        break;
      }
      case 'dash': {
        const s = t * 22;
        p.legA = [Math.sin(s) * .8, -.6]; p.legB = [-Math.sin(s) * .8, -.6];
        p.armA = [.6 + e, 2 - e * 2]; p.armB = [-.4, 1.2];
        p.lean = t < A.a ? -.15 : .35;
        break;
      }

      case 'swing': case 'rise': case 'slam': {

        if (t >= A.a && t <= A.b + .05) p.trail = [from, sh];
        break;
      }
    }
  }

  // ---- 描画 ----
  function limb(x0, y0, a1, a2, l1, l2) {

  function drawWeapon(kind, hx, hy, ang) {
    const dx = Math.sin(ang), dy = Math.cos(ang);
    const at = (d) => [hx + dx * d, hy + dy * d];

    if (kind === 'staff') {

      ctx.beginPath(); ctx.moveTo(...at(-22)); ctx.lineTo(...at(WLEN.staff)); ctx.stroke();

      ctx.strokeStyle = '#8a96a3'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(...at(5)); ctx.lineTo(...at(WLEN.sword)); ctx.stroke();
      ctx.strokeStyle = '#333';
      ctx.beginPath(); ctx.moveTo(...at(-6)); ctx.lineTo(...at(5)); ctx.stroke();
      const [gx, gy] = at(5);
      ctx.beginPath(); ctx.moveTo(gx + dy * 8, gy - dx * 8); ctx.lineTo(gx - dy * 8, gy + dx * 8); ctx.stroke();

  function drawFighter(F) {
    const p = pose(F), cam = game.camX;

    // 影
    const hgt = Math.max(0, GY - F.y);
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    ctx.beginPath(); ctx.ellipse(sx, GY + 3, 22 * F.scale * Math.max(.4, 1 - hgt / 300), 4, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.globalAlpha = F.state === 'dead' ? Math.max(0, 1 - Math.max(0, F.deadT - .8) / .8) : 1;
    if (F.inv > 0 && Math.floor(F.inv * 20) % 2) ctx.globalAlpha = .35;
    ctx.translate(sx, F.y - (F.state === 'dead' ? 6 : 0));
    ctx.scale(F.f * F.scale, F.scale);
    ctx.rotate(p.lean);
    const foot = (l) => Math.cos(l[0]) * 21 + Math.cos(l[0] + l[1]) * 21;
    const hipY = p.hipY ?? -Math.max(foot(p.legA), foot(p.legB));
    const shY = hipY - 34, headY = shY - 14;
    ctx.strokeStyle = F.color; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    limb(0, hipY, p.legB[0], p.legB[1], 21, 21);
    limb(p.chest, shY, p.armB[0], p.armB[1], 16, 16);
    ctx.moveTo(0, hipY); ctx.lineTo(p.chest, shY);
    limb(0, hipY, p.legA[0], p.legA[1], 21, 21);
    const hand = limb(p.chest, shY, p.armA[0], p.armA[1], 16, 16);
    ctx.stroke();
    // 振った軌跡
    if (p.trail && F.weapon) {
      const r = 32 + WLEN[F.weapon];
      ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 12;
      ctx.beginPath();
      for (let i = 0; i <= 10; i++) {
        const a = p.trail[0] + (p.trail[1] - p.trail[0]) * i / 10;
        ctx[i ? 'lineTo' : 'moveTo'](p.chest + Math.sin(a) * r, shY + Math.cos(a) * r);
      }
      ctx.stroke();
    }
    if (F.weapon) drawWeapon(F.weapon, ...hand);
    if (F.shield) {
      ctx.fillStyle = '#d5dde6'; ctx.strokeStyle = F.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(p.chest + 10, shY + 2, 9, 38, 3); ctx.fill(); ctx.stroke();
    }
    ctx.strokeStyle = F.color;
    // 主人公の鉢巻き
    if (F.player) {
      const w = Math.sin(game.time * 14) * 3;
      ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(p.chest - 8, headY - 3); ctx.quadraticCurveTo(p.chest - 18, headY - 6 + w, p.chest - 28, headY + w);
      ctx.moveTo(p.chest - 8, headY - 2); ctx.quadraticCurveTo(p.chest - 16, headY + 2 - w, p.chest - 24, headY + 6 - w);
      ctx.stroke();

    }
    ctx.lineWidth = 4;
    ctx.fillStyle = F.player ? PAPER : F.color;
    ctx.beginPath(); ctx.arc(p.chest, headY, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (F.player) {
      ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.chest, headY, 10, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    }
    ctx.restore();

    // 敵の振りかぶり中は頭の上に「!」を出す
    if (p.mark) {
      ctx.fillStyle = '#c0392b';
      ctx.font = `700 ${Math.round(22 * F.scale)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('!', sx, F.y - 115 * F.scale);
    }
  }
  function drawBG() {
    const cam = game.camX;
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
    const theme = STAGES[game.stage].theme;
    const far = cam * .2, mid = cam * .6;
    if (theme === 'city') {
      // 遠くのビル(視差 0.2)と電柱(視差 0.6)
      ctx.strokeStyle = '#e2ded2'; ctx.lineWidth = 2;
      for (let i = Math.floor(far / 70) - 1; i < (far + W) / 70 + 1; i++) {
        const h = 50 + hash(i) * 120, x = i * 70 - far;
        ctx.strokeRect(x, GY - h, 58, h);

      }

      for (let x = 0; x <= W; x += 8) {
        const wx = x + far;

        ctx.strokeStyle = '#c8bfa9'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x, GY - h); ctx.stroke();
        ctx.strokeStyle = '#bccbab'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, GY - h - 20, 34 + hash(i + 3) * 14, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x - 22, GY - h + 8, 22, 0, Math.PI * 2); ctx.stroke();
      }
    } else {
      // 城壁と塔、手前の旗
      ctx.strokeStyle = '#ddd6cc'; ctx.lineWidth = 2;
      for (let i = Math.floor(far / 60) - 1; i < (far + W) / 60 + 1; i++) {
        const x = i * 60 - far, tower = i % 6 === 0, h = tower ? 190 : 120;
        ctx.strokeRect(x, GY - h, 60, h);
        ctx.strokeRect(x + 8, GY - h - 14, 16, 14); ctx.strokeRect(x + 36, GY - h - 14, 16, 14);
        if (tower) { ctx.strokeRect(x + 24, GY - h + 30, 12, 20); }
        for (let by = GY - h + 20; by < GY; by += 24) { ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + 60, by); ctx.stroke(); }
      }
      for (let i = Math.floor(mid / 300) - 1; i < (mid + W) / 300 + 1; i++) {
        const x = i * 300 - mid + 100, w = Math.sin(game.time * 4 + i) * 5;
        ctx.strokeStyle = '#c9c4b6'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x, GY - 200); ctx.stroke();
        ctx.fillStyle = '#ead3cf';
        ctx.beginPath(); ctx.moveTo(x, GY - 200); ctx.lineTo(x + 44, GY - 188 + w); ctx.lineTo(x, GY - 172); ctx.fill();
      }
    }

    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, GY + 2); ctx.lineTo(W, GY + 2); ctx.stroke();

  function drawItems() {

  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function drawHUD() {
    ctx.textAlign = 'left'; ctx.fillStyle = '#222'; ctx.font = '700 14px sans-serif';
    ctx.fillText('HP', 18, 30);
    bar(46, 18, 220, 14, player.hp / player.max, player.hp > 30 ? '#2f9e44' : '#c0392b');
    ctx.font = '600 13px sans-serif'; ctx.fillStyle = '#555';
    ctx.fillText(`STAGE ${game.stage + 1} ${STAGES[game.stage].name} ・ 武器 ${WEAPONS[player.weapon].name}`, 18, 52);
    if (game.combo >= 2) { ctx.fillStyle = '#c0392b'; ctx.font = '700 20px sans-serif'; ctx.fillText(`${game.combo} HIT`, 18, 80); }
    ctx.textAlign = 'right'; ctx.fillStyle = '#222'; ctx.font = '700 14px sans-serif';
    ctx.fillText(`SCORE ${String(game.score).padStart(6, '0')}   TIME ${fmt(game.playT)}`, W - 18, 30);
    const boss = enemies.find((e) => e.T.boss && e.state !== 'dead');
    if (boss) {
      ctx.textAlign = 'center'; ctx.fillText('BOSS', W / 2, 30);
      bar(W / 2 - 160, 38, 320, 10, boss.hp / boss.max, '#3b3b3b');
    } else {
      // 進み具合
      const x0 = W / 2 - 150, x1 = W / 2 + 150;
      ctx.strokeStyle = '#bdb8aa'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0, 25); ctx.lineTo(x1, 25); ctx.stroke();
      for (const a of areas()) { const ax = x0 + (x1 - x0) * (a.x + W * .38) / GOAL_X; ctx.beginPath(); ctx.moveTo(ax, 20); ctx.lineTo(ax, 30); ctx.stroke(); }
      ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * Math.min(1, player.x / GOAL_X), 25, 5, 0, Math.PI * 2); ctx.fill();
    }
    if (game.goT > 0 && Math.floor(game.goT * 3) % 2 === 0) {
      ctx.fillStyle = '#c0392b'; ctx.font = '800 40px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('GO ▶', W - 30, 170);
    }
    if (game.banner > 0) {
      ctx.globalAlpha = Math.min(1, game.banner);
      ctx.textAlign = 'center'; ctx.fillStyle = '#222'; ctx.font = '800 40px "Hiragino Sans", "Noto Sans JP", sans-serif';
      ctx.fillText(`STAGE ${game.stage + 1}  ${STAGES[game.stage].name}`, W / 2, 140);
      ctx.fillStyle = '#c0392b'; ctx.font = '700 20px "Hiragino Sans", "Noto Sans JP", sans-serif';
      ctx.fillText(game.stage ? `${WEAPONS[player.weapon].name}を手に入れた。Z で振れる` : 'Z でパンチ、X でキック', W / 2, 176);
      ctx.globalAlpha = 1;
    }
  }
  function panel(lines) {
    ctx.fillStyle = 'rgba(251,250,246,.86)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    let y = H / 2 - (lines.length - 1) * 20;
    for (const [text, size, color] of lines) {
      ctx.fillStyle = color || '#222'; ctx.font = `700 ${size}px "Hiragino Sans", "Noto Sans JP", sans-serif`;
      ctx.fillText(text, W / 2, y); y += size + 18;
    }
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game.shake > 0) ctx.translate(rand(-1, 1) * game.shake, rand(-1, 1) * game.shake);
    drawBG();
    drawItems();
    const all = enemies.concat([player]).sort((a, b) => (a.state === 'dead') - (b.state === 'dead') || 0);
    for (const F of all.filter((f) => f.state === 'dead')) drawFighter(F);
    for (const F of all.filter((f) => f.state !== 'dead')) drawFighter(F);
    drawParts();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game.mode === 'title') {
      panel([['棒人間アクション', 44], ['敵を倒しながら右へ進み、ゴールの旗を目指す。全 3 ステージ', 18, '#555'], ['ステージを進むと武器が 素手 → 棒 → 剣 と強くなる', 18, '#555'], ['クリックか Enter でスタート', 20, '#c0392b']]);
    } else {
      drawHUD();
      if (game.mode === 'over') panel([['GAME OVER', 44, '#c0392b'], [`STAGE ${game.stage + 1} ・ スコア ${game.score} ・ 倒した数 ${game.kills}`, 18, '#555'], ['クリックか R でこのステージからやり直す', 20]]);
      else if (game.mode === 'stageclear') {
        const nx = STAGES[game.stage + 1];
        panel([[`STAGE ${game.stage + 1} CLEAR`, 44, '#2f9e44'], [`タイム ${fmt(game.clearT)} ・ スコア ${game.score}`, 18, '#555'], [`次のステージ「${nx.name}」では${WEAPONS[nx.weapon].name}を使える`, 22, '#c0392b'], ['クリックか Enter で次へ', 18]]);
      } else if (game.mode === 'clear') panel([['ALL CLEAR!', 48, '#2f9e44'], [`合計タイム ${fmt(game.totalT)} ・ スコア ${game.score} ・ 倒した数 ${game.kills}`, 18, '#555'], ['クリックか R で最初から', 20]]);
      else if (game.paused) panel([['一時停止中', 36], ['クリックか P で再開', 20, '#555']]);
    }
  }

  // ---- ループ ----
  function collect() {
    if (game.mode !== 'play') {
      const go = take('start') || take('retry') || (game.mode === 'title' && take('punch'));
      if (!go) return;
      if (game.mode === 'over') retryStage();
      else if (game.mode === 'stageclear') loadStage(game.stage + 1);
      else newGame();
      return;
    }
    if (game.paused) { if (take('start') || take('pause')) game.paused = false; return; }
    if (take('pause')) { game.paused = true; return; }
    if (take('retry')) { retryStage(); return; }
    if (take('punch')) { player.buf = 'punch'; player.bufT = .3; }
    if (take('kick')) { player.buf = 'kick'; player.bufT = .3; }
    if (take('jump')) player.jumpT = .15;
  }

  const STEP = 1 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000);
    last = now;
    collect();
    if (game.mode === 'play' && !game.paused) {
      acc += dt;
      while (acc >= STEP) { acc -= STEP; step(STEP); }
    } else {
      acc = 0;
      game.time += dt;
    }
    render();
    hits.clear();
    requestAnimationFrame(frame);
  }
  newGame();
  game.mode = 'title';
  // 自動テスト用。?debug を付けたときだけ中身を外から読めるようにする
  if (location.search.includes('debug')) window.__dbg = { game, get player() { return player; }, get enemies() { return enemies; }, loadStage };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
