<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DS から外れない UI 生成</title>
<style>
  :root {
    color-scheme: light;
    /* デモの枠 */
    --demo-bg: #f4f4f2;
    --demo-panel: #ffffff;
    --demo-ink: #222;
    --demo-muted: #6b6b6b;
    --demo-line: #dcdcd8;
    --demo-accent: #2f5bd3;
    --demo-ok: #1a7f4b;
    --demo-ng: #c2361f;
    /* Reservo(架空の予約管理 SaaS)のトークン */
    --r-primary: #0e877d;
    --r-surface: #ffffff;
    --r-surface-muted: #f5f7f7;
    --r-ink: #1f2726;
    --r-ink-muted: #5d6b69;
    --r-line: #dde4e3;
    --r-warning: #a05a0e;
    --r-warning-soft: #f8efe2;
    --r-radius: 8px;
    --r-radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--demo-bg);
    color: var(--demo-ink);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 28px; }
  button { font: inherit; cursor: pointer; }

  /* 進行バー */
  .steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 16px; flex-wrap: wrap; }
  .steps li { flex: 1 1 140px; padding: 8px 10px; border-radius: 8px; background: #e9e9e6; color: var(--demo-muted); font-size: 13px; line-height: 1.4; }
  .steps li b { display: block; font-size: 11px; font-weight: 600; }
  .steps li.done { background: #dfe9df; color: #2c5a35; }
  .steps li.now { background: var(--demo-accent); color: #fff; }

  .panel { background: var(--demo-panel); border: 1px solid var(--demo-line); border-radius: 12px; padding: 20px; }
  .panel h2 { margin: 0 0 4px; font-size: 19px; }
  .lead { margin: 0 0 16px; color: var(--demo-muted); }
  .lead b { color: var(--demo-ink); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
  .side { border: 1px solid var(--demo-line); border-radius: 10px; padding: 14px; background: #fff; }
  .side h3 { margin: 0 0 8px; font-size: 15px; }
  .score { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score small { font-size: 14px; color: var(--demo-muted); font-weight: 400; }
  .toast { min-height: 1.6em; font-size: 13px; color: var(--demo-muted); margin: 6px 0 0; }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .primary { background: var(--demo-accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; }
  .ghost { background: #fff; color: var(--demo-ink); border: 1px solid var(--demo-line); border-radius: 8px; padding: 8px 14px; }
  .note { font-size: 13px; color: var(--demo-muted); }

  /* チェック結果 */
  .results { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .results li { display: grid; grid-template-columns: 24px 1fr; gap: 2px 6px; font-size: 13px; }
  .results .num { width: 20px; height: 20px; border-radius: 50%; background: var(--demo-ng); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .results li.ok .num { background: var(--demo-ok); }
  .results .t { font-weight: 600; }
  .results .d { grid-column: 2; color: var(--demo-muted); }
  .results .how { grid-column: 2; font-size: 11px; color: #7a5a00; }
  .results .you { grid-column: 2; font-size: 12px; }
  .you.found { color: var(--demo-ok); }
  .you.missed { color: var(--demo-ng); }

  .compare { display: flex; margin-bottom: 10px; border: 1px solid var(--demo-line); border-radius: 8px; overflow: hidden; width: fit-content; }
  .compare button { border: 0; background: #fff; padding: 6px 14px; font-size: 13px; }
  .compare button[aria-pressed="true"] { background: var(--demo-accent); color: #fff; }

  .diff { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px; }
  .diff div { border: 1px solid var(--demo-line); border-radius: 6px; overflow: hidden; }
  .diff p { margin: 0; padding: 4px 8px; white-space: pre-wrap; word-break: break-all; }
  .diff .h { background: #f1f1ee; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 600; }
  .diff .m { background: #fbeceb; color: #8a2a1a; }
  .diff .p { background: #e8f4ec; color: #1d5e37; }

  /* ブラウザ枠 */
  .browser { border: 1px solid #cfcfca; border-radius: 10px; overflow: hidden; background: var(--r-surface-muted); }
  .browser .bar { background: #e8e8e4; padding: 6px 10px; font-size: 12px; color: #777; display: flex; gap: 6px; align-items: center; }
  .browser .bar span.dot { width: 9px; height: 9px; border-radius: 50%; background: #c9c9c4; display: inline-block; }
  .browser .bar code { margin-left: 8px; background: #fff; border-radius: 4px; padding: 0 8px; font-family: inherit; }
  .hunt .r-main { cursor: crosshair; }
  [data-v] { position: relative; }
  .mark { outline: 2px dashed var(--demo-ng); outline-offset: 3px; }
  .mark.found { outline-color: var(--demo-ok); outline-style: solid; }
  .pin { position: absolute; top: -10px; right: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--demo-ng); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; z-index: 2; font-family: "Hiragino Sans", sans-serif; line-height: 1; }
  .pin.found { background: var(--demo-ok); }

  /* ---- Reservo の画面 ---- */
  .r { color: var(--r-ink); font-size: 13px; }
  .r-top { background: var(--r-surface); border-bottom: 1px solid var(--r-line); padding: 8px 16px; display: flex; gap: 18px; align-items: center; }
  .r-logo { font-weight: 700; color: var(--r-primary); }
  .r-nav { display: flex; gap: 14px; color: var(--r-ink-muted); }
  .r-nav .on { color: var(--r-ink); font-weight: 600; }
  .r-main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .r-head { display: flex; align-items: flex-start; gap: 12px; }
  .r-head h1 { margin: 0; font-size: 18px; }
  .r-head p { margin: 2px 0 0; color: var(--r-ink-muted); font-size: 12px; }
  .r-head > :last-child { margin-left: auto; }
  .r-btn { background: var(--r-primary); color: #fff; border: 0; border-radius: var(--r-radius); padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .r-label { font-size: 12px; color: var(--r-ink-muted); display: block; margin-bottom: 4px; }
  .r-input { width: 100%; border: 1px solid var(--r-line); border-radius: var(--r-radius); padding: 7px 10px; font: inherit; background: var(--r-surface); color: var(--r-ink); }
  .r-searchrow { display: flex; gap: 8px; }
  .r-card { background: var(--r-surface); border: 1px solid var(--r-line); border-radius: var(--r-radius); overflow: hidden; }
  .r-table { width: 100%; border-collapse: collapse; }
  .r-table th { text-align: left; font-size: 11px; color: var(--r-ink-muted); font-weight: 600; background: var(--r-surface-muted); padding: 7px 10px; border-bottom: 1px solid var(--r-line); white-space: nowrap; }
  .r-table td { padding: 7px 10px; border-bottom: 1px solid var(--r-line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .r-table tr:last-child td { border-bottom: 0; }
  .r-link { color: var(--r-primary); text-decoration: underline; text-underline-offset: 2px; }
  .r-badge { display: inline-block; margin-left: 6px; font-size: 11px; padding: 0 6px; border-radius: var(--r-radius-sm); background: var(--r-warning-soft); color: var(--r-warning); vertical-align: 1px; }
  .r-empty { text-align: center; padding: 28px 12px; white-space: normal; }
  .r-empty p { margin: 0; }
  .r-empty .sub { color: var(--r-ink-muted); font-size: 12px; margin-top: 4px; }
  .r-blank { display: block; height: 70px; margin: 8px; }
  .r-scroll { overflow-x: auto; }
  .blank-note { display: grid; place-items: center; height: 100%; color: var(--demo-ng); font-size: 12px; }

  /* AI の初回生成に混ざった直値(違反の再現) */
  .raw-btn { background: #14b8a6; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .raw-pill { display: inline-block; font-size: 11px; padding: 0 8px; border-radius: 999px; background: #fde68a; color: #78350f; }
  .raw-panel { display: block; background: #fff; border-radius: 14px; box-shadow: 0 4px 12px rgba(0, 0, 0, .08); padding: 12px; }
  .pillwrap { display: inline-block; margin-left: 6px; vertical-align: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <ol class="steps" id="steps"></ol>
  <div class="panel" id="stage"></div>
</div>

<script>
(() => {
  // ---- デモのデータ(架空の予約管理 SaaS「Reservo」) ----
  const MEMBERS = [
    { name: "佐藤 花子", kana: "さとう はなこ", no: "M-0001", phone: "090-1234-5678", visits: 12, last: "2026-09-10" },
    { name: "田中 一郎", kana: "たなか いちろう", no: "M-0002", phone: "080-2345-6789", visits: 8, last: "2026-09-05" },
    { name: "鈴木 美咲", kana: "すずき みさき", no: "M-0003", phone: "090-3456-7890", visits: 21, last: "2026-09-14" },
    { name: "高橋 健", kana: "たかはし けん", no: "M-0004", phone: "070-4567-8901", visits: 3, last: "2026-08-30" },
    { name: "伊藤 さくら", kana: "いとう さくら", no: "M-0005", phone: "090-5678-9012", visits: 15, last: "2026-09-12" },
    { name: "渡辺 大輔", kana: "わたなべ だいすけ", no: "M-0006", phone: "080-6789-0123", visits: 6, last: "2026-09-01" },
    { name: "山本 千夏", kana: "やまもと ちなつ", no: "M-0007", phone: "090-7890-1234", visits: 9, last: "2026-09-08" },
    { name: "中村 拓也", kana: "なかむら たくや", no: "M-0008", phone: "070-8901-2345", visits: 1, last: "2026-07-22" },
  ];
  const REGULAR = 10; // 来店 10 回以上に「常連」ラベル

  // 初回の画面に仕込んだ違反。how は検出の方法
  const VIOLATIONS = [
    { id: 1, t: "ブランド色に似た色を直書き", d: "「会員を登録」の背景が #14b8a6。DS の主な色(#0e877d)と少し違う", how: "コードの文字列検査で検出" },
    { id: 2, t: "DS にないラベルを自作", d: "「常連」を span で自作している。DS の Badge を使っていない", how: "DS のルールに照らした AI レビューで検出" },
    { id: 3, t: "塗りのボタンが 2 つ", d: "「検索」も塗りのボタン。DS では塗りを画面の主な操作 1 つに使う", how: "DS のルールに照らした AI レビューで検出" },
    { id: 4, t: "角丸と影を直値で指定", d: "検索パネルが角丸 14px と独自の影。DS のカードは角丸 8px で影なし", how: "コードの文字列検査で検出" },
    { id: 5, t: "0 件のときの表示がない", d: "検索結果が 0 件だと、表の見出しだけが残って何も出ない", how: "DS のルールに照らした AI レビューで検出" },
  ];

  const DIFFS = [
    { id: 1, m: '<button className="bg-[#14b8a6] rounded-[8px] ...">会員を登録</button>', p: "<Button>会員を登録</Button>" },
    { id: 2, m: '<span className="rounded-full bg-[#fde68a] px-2">常連</span>', p: '<Badge tone="warning">常連</Badge>' },
    { id: 3, m: "<Button>検索</Button>", p: "(削除。入力した時点で絞り込む)" },
    { id: 4, m: '<div className="rounded-[14px] shadow-[0_4px_12px_rgba(0,0,0,.08)] p-3">', p: "<Card>" },
    { id: 5, m: "(0 件のときの分岐なし)", p: "{rows.length === 0 && <EmptyRow>該当する会員が見つかりません</EmptyRow>}" },
  ];

  const STEPS = ["初回の画面を見る", "自動チェック", "AI が直す", "人の確認"];

  const s = { step: 0, found: new Set(), query: "", view: "after", toast: "", decided: false };

  const $steps = document.getElementById("steps");
  const $stage = document.getElementById("stage");
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function renderSteps() {
    $steps.innerHTML = STEPS.map((n, i) =>
      `<li class="${i < s.step ? "done" : i === s.step ? "now" : ""}"><b>${i + 1}</b>${n}</li>`).join("");
  }

  function filtered() {
    const q = s.query.replace(/[\s-]/g, "");
    if (!q) return MEMBERS;
    // 数字だけなら電話番号の末尾で照合する(下 4 桁で探す使い方に合わせる)
    if (/^\d+$/.test(q)) return MEMBERS.filter((m) => m.phone.replace(/-/g, "").endsWith(q));
    return MEMBERS.filter((m) => (m.name + m.kana).replace(/\s/g, "").includes(q));
  }

  // mode: "hunt"(探す)/ "flag"(違反を全部示す)/ "fixed"(直した後)
  function screen(mode) {
    const raw = mode !== "fixed";
    // 違反の箇所を包む。探す段階では見つけた箇所だけ、示す段階では全部に印を付ける
    const pinned = new Set(); // 同じ違反が複数の行にあっても、印は最初の 1 か所だけに付ける
    const v = (id, inner, cls = "") => {
      const found = s.found.has(id);
      const marked = (mode === "flag" || (mode === "hunt" && found)) && !pinned.has(id);
      if (marked) pinned.add(id);
      const pin = !marked ? "" : `<span class="pin ${found ? "found" : ""}">${mode === "hunt" ? "✓" : id}</span>`;
      return `<span data-v="${id}" class="${cls}${marked ? " mark" : ""}${marked && found ? " found" : ""}">${inner}${pin}</span>`;
    };

    const regBtn = raw ? v(1, `<button type="button" class="raw-btn" tabindex="-1">会員を登録</button>`)
      : `<button type="button" class="r-btn">会員を登録</button>`;
    const head = `<div class="r-head"><div><h1>会員</h1><p>電話予約の受付中に、会員を見つけて詳細を開きます</p></div>${regBtn}</div>`;

    const input = `<input id="q" class="r-input" placeholder="例:さとう / 5678" value="${esc(s.query)}">`;
    const search = raw
      ? v(4, `<label class="r-label" for="q">氏名・かな・電話番号で検索</label><span class="r-searchrow">${input}${v(3, `<button type="button" class="r-btn" tabindex="-1">検索</button>`)}</span>`, "raw-panel")
      : `<div><label class="r-label" for="q">氏名・かな・電話番号で検索</label>${input}</div>`;

    const rows = filtered();
    const label = (m) => m.visits < REGULAR ? "" : raw ? v(2, `<span class="raw-pill">常連</span>`, "pillwrap") : `<span class="r-badge">常連</span>`;
    let tbody = "";
    if (rows.length > 0) {
      tbody = rows.map((m) => `<tr><td><span class="r-link">${m.name}</span>${label(m)}</td><td>${m.no}</td><td>${m.phone}</td><td>${m.visits} 回</td><td>${m.last}</td></tr>`).join("");
    } else if (!raw) {
      tbody = `<tr><td colspan="5"><div class="r-empty"><p>該当する会員が見つかりません</p><p class="sub">氏名の一部・かな・電話番号の下 4 桁でも検索できます</p></div></td></tr>`;
    }
    let table = `<div class="r-scroll"><table class="r-table"><thead><tr><th>氏名</th><th>会員番号</th><th>電話番号</th><th>来店回数</th><th>最終来店</th></tr></thead><tbody>${tbody}</tbody></table></div>`;
    // 0 件の違反は画面に形がないので、0 件になったときの空白か、違反を示す段階で場所を出す
    if (raw && (rows.length === 0 || mode === "flag")) table += v(5, mode === "flag" ? `<span class="blank-note">検索結果が 0 件のとき、ここに何も表示されない</span>` : "", "r-blank");

    return `<div class="browser ${mode === "hunt" ? "hunt" : ""}"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><code>reservo.example/members</code></div>
      <div class="r"><div class="r-top"><span class="r-logo">Reservo</span><nav class="r-nav"><span>予約</span><span class="on">会員</span><span>設定</span></nav></div>
      <div class="r-main">${head}${search}<div class="r-card">${table}</div></div></div></div>`;
  }

  function bindSearch() {
    const q = document.getElementById("q");
    if (!q) return;
    q.addEventListener("input", () => {
      s.query = q.value;
      const pos = q.selectionStart;
      render();
      const q2 = document.getElementById("q");
      q2.focus(); q2.setSelectionRange(pos, pos);
    });
  }

  function bindHunt() {
    const main = document.querySelector(".browser .r");
    if (!main) return;
    main.addEventListener("click", (e) => {
      if (e.target.closest("#q") || e.target.closest("label")) return;
      const el = e.target.closest("[data-v]");
      if (el) {
        const id = Number(el.dataset.v);
        if (s.found.has(id)) s.toast = "そこは見つけ済みです";
        else { s.found.add(id); s.toast = `見つけました:${VIOLATIONS[id - 1].t}`; }
      } else {
        s.toast = "そこは DS どおりです";
      }
      render();
    });
  }

  const resultList = () => `<ul class="results">${VIOLATIONS.map((x) => `
      <li><span class="num">${x.id}</span><span class="t">${x.t}</span>
        <span class="d">${x.d}</span>
        <span class="how">${x.how}</span>
        <span class="you ${s.found.has(x.id) ? "found" : "missed"}">${s.found.has(x.id) ? "あなたも見つけた" : "あなたは見落とした"}</span></li>`).join("")}</ul>`;

  const views = [
    // 1. 探す
    () => `<h2>AI が作った画面から、DS 違反を探す</h2>
      <p class="lead">架空の予約管理サービス「Reservo」の会員一覧を、AI に作らせました。この画面には <b>DS(デザインシステム)から外れた箇所が 5 つ</b>あります。怪しいと思った箇所をクリックしてください。検索欄に文字を入れると、0 件のときの画面も見られます。</p>
      <div class="layout">${screen("hunt")}
        <div class="side"><h3>あなたが見つけた数</h3>
          <div class="score">${s.found.size}<small> / 5</small></div>
          <p class="toast">${s.toast}</p>
          <div class="actions"><button class="primary" id="next">自動チェックで答え合わせ</button></div>
          <p class="note" style="margin:10px 0 0">ヒント:Reservo の DS では、主な色は深い緑(#0e877d)、カードは角丸 8px で影なし、ラベルは Badge 部品を使います。</p>
        </div></div>`,
    // 2. 自動チェック
    () => `<h2>自動チェックの結果</h2>
      <p class="lead">同じ画面に自動チェックをかけると、5 件すべてが場所つきで出ます。あなたが見つけたのは <b>${s.found.size} 件</b>、見落としたのは <b>${5 - s.found.size} 件</b>です。人に見せる前にこの 5 件を落とすので、DS から外れた画面は人のところまで届きません。</p>
      <div class="layout">${screen("flag")}
        <div class="side"><h3>検出した違反 5 件</h3>${resultList()}
          <div class="actions"><button class="primary" id="next">AI に直させる</button></div></div></div>`,
    // 3. AI が直す
    () => `<h2>AI が直して、もう一度チェックする</h2>
      <p class="lead">AI は違反を 1 件ずつ、DS の部品とトークンに置き換えました。再チェックの結果は <b>0 件</b>です。直す前と後を切り替えて比べられます。</p>
      <div class="compare"><button type="button" data-view="before" aria-pressed="${s.view === "before"}">直す前</button><button type="button" data-view="after" aria-pressed="${s.view === "after"}">直した後</button></div>
      <div class="layout">${screen(s.view === "before" ? "flag" : "fixed")}
        <div class="side"><h3>コードの変更</h3>
          <div class="diff">${DIFFS.map((d) => `<div><p class="h">${d.id}. ${VIOLATIONS[d.id - 1].t}</p><p class="m">- ${esc(d.m)}</p><p class="p">+ ${esc(d.p)}</p></div>`).join("")}</div>
          <div class="actions"><button class="primary" id="next">人の確認へ</button></div></div></div>`,
    // 4. 人の確認
    () => `<h2>人が確認するのは、目的に合っているかだけ</h2>
      <p class="lead">色の値や部品の使い方は、自動チェックで確認済みです。人が判断するのは、この画面が <b>「電話対応中のスタッフが、名前や電話番号から会員を見つけ出す」</b> という目的に合っているかです。</p>
      <div class="layout">${screen("fixed")}
        <div class="side"><h3>${s.decided ? "採用しました" : "この画面を採用しますか"}</h3>
          ${s.decided
            ? `<p class="note" style="margin:0">あなたが見つけた違反は ${s.found.size} 件、自動チェックが見つけた違反は 5 件でした。5 件とも直してから採用しています。</p>
               <div class="actions"><button class="ghost" id="restart">最初からやり直す</button></div>`
            : `<p class="note" style="margin:0">検索欄に「さとう」や「5678」を入れて、使い勝手を確かめてから決めてください。</p>
               <div class="actions"><button class="primary" id="ok">採用する</button></div>`}
        </div></div>`,
  ];

  function go(n) {
    s.step = n; s.query = ""; s.toast = ""; render();
    // ブログの枠に埋め込まれたときは、枠の先頭まで戻す
    try { if (window.frameElement) window.frameElement.scrollIntoView({ block: "start", behavior: "smooth" }); else window.scrollTo(0, 0); } catch (e) { window.scrollTo(0, 0); }
  }

  function render() {
    renderSteps();
    $stage.innerHTML = views[s.step]();
    bindSearch();
    if (s.step === 0) bindHunt();
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };
    on("next", () => go(s.step + 1));
    document.querySelectorAll(".compare button").forEach((b) => b.addEventListener("click", () => { s.view = b.dataset.view; render(); }));
    on("ok", () => { s.decided = true; render(); });
    on("restart", () => { s.found = new Set(); s.view = "after"; s.decided = false; go(0); });
  }

  render();
})();
</script>
</body>
</html>
